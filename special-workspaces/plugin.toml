id = "jamesfeeder/special-workspaces"
name = "Special Workspaces"
version = "1.2.0"
plugin_api = 3
author = "jamesfeeder"
license = "MIT"
icon = "stack-2"
description = "Show populated Hyprland special workspaces as bar chips."
tags = ["hyprland", "indicator", "bar"]
dependencies = ["hyprctl", "socat"]

[[service]]
id = "workspace-state"
entry = "service.luau"

[[widget]]
id = "special-workspaces"
entry = "widget.luau"

  [[widget.setting]]
  key = "max_label_chars"
  type = "int"
  label_key = "settings.max_label_chars.label"
  description_key = "settings.max_label_chars.description"
  default = 0
  min = 0
  max = 64

  [[widget.setting]]
  key = "hide_inactive"
  type = "bool"
  label_key = "settings.hide_inactive.label"
  description_key = "settings.hide_inactive.description"
  default = false

  [[widget.setting]]
  key = "pill_radius"
  type = "int"
  label_key = "settings.pill_radius.label"
  description_key = "settings.pill_radius.description"
  default = 8
  min = 0
  max = 80

  [[widget.setting]]
  key = "secondary_inactive"
  type = "bool"
  label_key = "settings.secondary_inactive.label"
  description_key = "settings.secondary_inactive.description"
  default = true
  visible_when = { key = "hide_inactive", values = ["false"] }
