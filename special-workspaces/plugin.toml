id = "jamesfeeder/special-workspaces"
name = "Special Workspaces"
version = "1.1.2"
plugin_api = 3
author = "jamesfeeder"
license = "MIT"
icon = "stack-2"
description = "Show populated Hyprland special workspaces as toggleable bar chips."
tags = ["hyprland", "workspaces", "bar"]
dependencies = ["hyprctl", "socat"]

[[service]]
id = "workspace-state"
entry = "service.luau"

[[widget]]
id = "special-workspaces"
entry = "widget.luau"

  [[widget.setting]]
  key = "max_label_chars"
  type = "int"
  label_key = "settings.max_label_chars.label"
  description_key = "settings.max_label_chars.description"
  default = 0
  min = 0
  max = 64
